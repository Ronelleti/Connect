services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://wecomconnect:wecomconnect@postgres:5432/wecomconnect
      AUTH_SECRET: ${AUTH_SECRET:-development-docker-secret-change-me}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/migrate.mjs && node server.js"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wecomconnect
      POSTGRES_USER: wecomconnect
      POSTGRES_PASSWORD: wecomconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecomconnect -d wecomconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
